name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - uses: pre-commit/action@v3.0.1

  build-deb:
    name: build deb (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - name: Cache duckdb download
        uses: actions/cache@v4
        with:
          path: build/cache
          key: duckdb-${{ matrix.arch }}-${{ hashFiles('Makefile') }}

      - name: Build .deb
        run: make deb ARCH=${{ matrix.arch }}

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: journql-${{ matrix.arch }}-deb
          path: build/*_${{ matrix.arch }}.deb
          if-no-files-found: error

  lintian:
    name: lintian (${{ matrix.arch }})
    needs: build-deb
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: journql-${{ matrix.arch }}-deb
          path: build

      - name: Install lintian
        run: |
          sudo apt-get update
          sudo apt-get install -y lintian

      - name: Run lintian
        run: lintian build/*_${{ matrix.arch }}.deb
